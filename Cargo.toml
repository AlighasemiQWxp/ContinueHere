[workspace]
members = ["crates/continuehere"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Dalton"]
description = "A modular cross-platform application for continuing activities on trusted devices"
repository = "https://github.com/AlighasemiQWxp/ContinueHere"
keywords = ["handoff", "cross-platform", "continuity", "device"]
categories = ["network-programming"]

[workspace.dependencies]
atomic-write-file = "0.3"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
