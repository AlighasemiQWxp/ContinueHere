[workspace]
members = ["crates/continuehere"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
authors = ["Dalton"]
description = "A modular cross-platform application for continuing activities on trusted devices"
repository = "https://github.com/AlighasemiQWxp/ContinueHere"
keywords = ["handoff", "cross-platform", "continuity", "device"]
categories = ["network-programming"]

[workspace.dependencies]
atomic-write-file = "0.3"
async-trait = "0.1"
getrandom = "0.3"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "sync-secret-service", "windows-native"] }
mdns-sd = "0.21"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
thiserror = "2"
tokio = "1"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
