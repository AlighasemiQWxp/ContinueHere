[package]
name = "continuehere_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
description = "Native Slint client for ContinueHere"
repository.workspace = true
publish = false

[lib]
name = "continuehere_android"
crate-type = ["cdylib"]

[dependencies]
continuehere = { path = "../../crates/continuehere" }
slint.workspace = true
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
open = "5"
url.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.15", default-features = false }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
winreg = "0.55"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
robius-android-env = "0.2.0"
robius-file-picker = "0.3.1"
slint = { workspace = true, features = ["backend-android-activity-06"] }

[package.metadata.android]
package = "dev.continuehere.app"
apk_name = "ContinueHere"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

[package.metadata.android.application]
label = "ContinueHere"
theme = "@android:style/Theme.Material.Light.NoActionBar"

[build-dependencies]
slint-build = "=1.17.1"
winresource = "0.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
