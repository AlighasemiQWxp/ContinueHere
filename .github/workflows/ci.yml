name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev pkg-config

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Use stable Rust
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  windows-client:
    name: Windows client
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/client

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        run: rustup default stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Resolve client dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze client
        run: flutter analyze

      - name: Test client
        run: flutter test

      - name: Build Windows client
        run: flutter build windows
